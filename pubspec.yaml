name: flutter_offline_first_sync
description: >-
  Offline-first sync engine for Flutter: durable outbox, dependency-aware
  push with id remapping, resumable pull, retries, conflict resolution, and
  status streams.
version: 0.1.0
homepage: https://github.com/ahmedalgarbani/flutter_offline_sync
repository: https://github.com/ahmedalgarbani/flutter_offline_sync
issue_tracker: https://github.com/ahmedalgarbani/flutter_offline_sync/issues
topics:
  - offline
  - sync
  - database
  - rest
  - connectivity

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
