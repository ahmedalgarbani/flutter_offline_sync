name: flutter_offline_sync
description: >-
  Offline-first sync engine for Flutter: a durable outbox, dependency-aware
  push with local-to-server id remapping, resumable pull, retries, conflict
  resolution and status streams. Storage- and backend-agnostic.
version: 0.1.0
publish_to: none
homepage: https://github.com/ahmedalgarbani/flutter_offline_sync
repository: https://github.com/ahmedalgarbani/flutter_offline_sync

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
